name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # UPDATED: Now uses macOS 15 to match Tuist's requirements

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Tuist
        run: brew install tuist

      - name: Verify Tools
        run: |
          xcodebuild -version
          tuist version

      - name: Generate Xcode Project
        run: tuist generate

      - name: List Workspace Schemes (Debug)
        run: xcodebuild -list -workspace residence.xcworkspace

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild archive \
            -workspace residence.xcworkspace \
            -scheme residence \
            -archivePath residence.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create ExportOptions.plist
        run: |
          cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath residence.xcarchive \
            -exportPath ipa_output \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: ipa_output/*.ipa
